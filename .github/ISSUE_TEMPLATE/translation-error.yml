name: 译文问题
description: 某条提示词的翻译有误、格式损坏或内容缺失
title: '[译文] '
labels: ['译文问题']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。本站的译文由机器翻译批量生成，出错是预期之内的，报上来就能重翻。

        详情页右上角的「译文有问题？」链接会自动把这个表单填好，如果你是从那里过来的，下面几项应该已经有值了。

  - type: input
    id: page
    attributes:
      label: 出问题的页面
      description: 从详情页的「译文有问题？」进来时会自动填好。
      placeholder: https://kael-odin.github.io/prompts-chat-zh/prompts/...
    validations:
      required: true

  - type: input
    id: slug
    attributes:
      label: 条目 slug
      description: 页面地址里 /prompts/ 和结尾斜杠之间的那段。自动填好的话可以不管。
      placeholder: linux-terminal
    validations:
      required: false

  - type: dropdown
    id: kind
    attributes:
      label: 问题类型
      options:
        - 翻译不准确或有歧义
        - 格式损坏（标题、列表、表格渲染异常）
        - 代码块或占位符被改动
        - 内容缺失或被截断
        - 译文与英文原文意思不符
        - 其他
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: 具体说明
      description: 哪里不对、应该是什么样。如果方便，直接给出你期望的译法，我会照着改进翻译提示词。
      placeholder: |
        比如：正文第 3 段的 "..." 译成了 "...",
        但这里指的是 ...，应该译作 "..."
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已经对比过页面上的英文原文（详情页可切换到「对照」模式）
          required: true
        - label: 这不是对上游原文本身的意见（内容问题请提给 prompts.chat）
          required: true
